name: Auto Release (ZIP Only)

on:
  push:
    branches:
      - release   # release 브랜치에 push(또는 머지)될 때 작동

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Release 작성을 위해 쓰기 권한 허용

    steps:
      # 1. 소스 코드 가져오기
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Node.js 환경 세팅
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. manifest.json에서 버전 정보 동적으로 추출
      - name: Extract Version from manifest.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # 4. 배포용 ZIP 파일 생성 (불필요한 git, github 설정 및 대용량 har 파일 제외)
      - name: Pack Extension to ZIP
        run: |
          zip -r gemini-extension-v${{ steps.get_version.outputs.VERSION }}.zip . \
          -x "*.git*" "*.github*" "node_modules/*" "*.har" "README.md"

      # 5. GitHub Release 생성 및 ZIP 업로드
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## Gemini Extension v${{ steps.get_version.outputs.VERSION }} 자동 릴리스
            
            - 본 릴리스는 `release` 브랜치 머지를 통해 자동 생성되었습니다.
            - 크롬 수동 설치를 위한 `.zip` 배포 파일이 아래 에셋으로 제공됩니다.
          draft: false
          prerelease: false
          files: |
            gemini-extension-v${{ steps.get_version.outputs.VERSION }}.zip
